name: Build CARLA UE5

# Builds the CARLA Linux distribution on the self-hosted runner and publishes it to
# Artifactory (cat-local-generic-dev/carla/releases/).
#
# Triggered manually only. The job runs the checked-out revision's own build scripts on
# the build host with access to the runner account's Artifactory token and content deploy
# key, so it must not fire automatically on a push or a pull request until the branch and
# author rules for that are settled.

on:
  workflow_dispatch:
    inputs:
      ue_distribution:
        description: 'UE distribution filename in Artifactory'
        required: false
        default: 'UnrealEngine-5.7.4-carla-port-049f42955-Linux.tar.zst'
      content_ref:
        description: 'carla-content ref to build against'
        required: false
        default: 'ue5-dev'
      content_mount_mode:
        description: 'How to mount the content snapshot into the build container'
        required: false
        type: choice
        default: 'auto'
        options: ['auto', 'overlay', 'readonly', 'readwrite']
      clean_build:
        description: 'Discard the cached Build/ tree and third-party dependency cache'
        required: false
        type: boolean
        default: false
      skip_upload:
        description: 'Skip publishing to Artifactory'
        required: false
        type: boolean
        default: false

# The build host has one runner and the caches below are shared mutable state, so two
# distribution builds must never overlap. Queue instead of cancelling: a cancelled build
# leaves a half-written Build/ tree that the next run would have to sort out.
concurrency:
  group: carla-distribution-build
  cancel-in-progress: false

env:
  UE_DISTRIBUTION: ${{ inputs.ue_distribution }}
  CONTENT_REF: ${{ inputs.content_ref }}
  ARTIFACTORY_UE_REPO: 'cat-local-generic-dev/unreal'
  ARTIFACTORY_CARLA_REPO: 'cat-local-generic-dev/carla'
  RELEASES_TO_KEEP: '3'
  CONTAINER_IMAGE: 'iasartifact.sncorp.com:8443/cat-docker-dev/carla-base:alma8'
  # Relative to the workspace; the content snapshot is mounted here inside the container.
  CONTENT_MOUNT_REL: 'Unreal/CarlaUnreal/Content/Carla'

jobs:
  build:
    name: Build CARLA Distribution
    runs-on: self-hosted

    steps:
      # ────────────────────────────────────────────────────────────────────
      # Pre-checkout safety
      # ────────────────────────────────────────────────────────────────────
      - name: Check for a leaked content bind mount
        run: |
          # If a previous container was killed and left its bind mount behind, the content
          # snapshot is still visible inside the workspace. Anything that then cleans the
          # workspace would delete straight through the mount into the cache. Refuse to run
          # rather than risk it; the fix is to unmount the stale path by hand.
          MOUNT_PATH="${GITHUB_WORKSPACE}/${CONTENT_MOUNT_REL}"
          if awk -v p="$MOUNT_PATH" '$5 == p { found = 1 } END { exit !found }' /proc/self/mountinfo; then
            echo "ERROR: a stale bind mount is still active at $MOUNT_PATH" >&2
            echo "       Unmount it before re-running: fusermount -u '$MOUNT_PATH' || umount '$MOUNT_PATH'" >&2
            exit 1
          fi
          echo "No stale bind mount at $MOUNT_PATH"

      # ────────────────────────────────────────────────────────────────────
      # Checkout
      # ────────────────────────────────────────────────────────────────────
      - name: Checkout CARLA repository
        uses: actions/checkout@v4
        with:
          # Full history so the build can describe the revision it produced.
          fetch-depth: 0
          lfs: false
          # actions/checkout's default cleanup is `git clean -ffdx`, which deletes ignored
          # paths -- including Build/. That discards the vcpkg dependencies, the Cesium
          # source build and every compiled object, turning every run into a cold build.
          # The workspace is cleaned explicitly below instead.
          clean: false

      - name: Clean tracked workspace
        run: |
          # Remove untracked files that are not ignored, so a rename or deletion in the
          # repository cannot leave a stale source file behind. Ignored paths (Build/ and
          # Unreal/CarlaUnreal/Content/) are deliberately left alone: -x is not passed.
          # Nothing here needs elevated privileges -- the container runs with the runner's
          # own uid, so every file it creates is already owned by this account.
          git clean -ffd
          git status --short | head -20

      - name: Discard cached build tree
        if: ${{ inputs.clean_build }}
        run: |
          case "$GITHUB_WORKSPACE" in
            */actions-runner/_work/*/*) ;;
            *)
              echo "ERROR: refusing to clean an unexpected workspace: $GITHUB_WORKSPACE" >&2
              exit 1
              ;;
          esac
          . "$GITHUB_WORKSPACE/Scripts/Linux/BuildServer/runner-env.sh"
          echo "Removing $GITHUB_WORKSPACE/Build"
          rm -rf "$GITHUB_WORKSPACE/Build"
          echo "Removing the third-party dependency cache under $BUILD_HOME_DIR"
          rm -rf "$BUILD_HOME_DIR/.ezvcpkg"

      - name: Make build server scripts executable
        run: |
          # The scripts are executed from the checkout rather than installed into
          # /usr/local/bin, so they version with the workflow that calls them and are not
          # exposed to unrelated users of the build host. chmod guards against a checkout
          # that lost the executable bit.
          chmod +x "$GITHUB_WORKSPACE"/Scripts/Linux/BuildServer/*

      # ────────────────────────────────────────────────────────────────────
      # Container image
      # ────────────────────────────────────────────────────────────────────
      - name: Pull container image
        run: |
          . "$GITHUB_WORKSPACE/Scripts/Linux/BuildServer/runner-env.sh"

          if [ -f "$HOME/.docker/config.json" ]; then
            AUTH_SOURCE="$HOME/.docker/config.json"
          elif [ -f "$HOME/.config/containers/auth.json" ]; then
            AUTH_SOURCE="$HOME/.config/containers/auth.json"
          else
            echo "ERROR: no OCI registry credentials under $HOME" >&2
            echo "       See Docs/build_runner_setup.md for the podman login step." >&2
            exit 1
          fi

          # Copy the credentials per job so concurrent or interrupted runs cannot corrupt
          # the account-level auth file. Removed again by the cleanup step below.
          AUTH_COPY="${RUNNER_TEMP}/podman-auth-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          install -m 600 "$AUTH_SOURCE" "$AUTH_COPY"
          echo "REGISTRY_AUTH_FILE=$AUTH_COPY" >> "$GITHUB_ENV"

          REGISTRY_AUTH_FILE="$AUTH_COPY" podman pull "$CONTAINER_IMAGE"

      # ────────────────────────────────────────────────────────────────────
      # Build inputs
      # ────────────────────────────────────────────────────────────────────
      - name: Sync CARLA content snapshot
        id: content
        run: |
          . "$GITHUB_WORKSPACE/Scripts/Linux/BuildServer/runner-env.sh"

          # Publishes an immutable, per-commit snapshot of the content tree and prints its
          # path. When the content commit is unchanged -- the usual case, since the
          # repository changes rarely -- this costs one ls-remote and no transfer at all.
          SNAPSHOT=$("$GITHUB_WORKSPACE/Scripts/Linux/BuildServer/sync-carla-content" \
            --ref "$CONTENT_REF" --keep 3)

          echo "snapshot=$SNAPSHOT" >> "$GITHUB_OUTPUT"
          echo "commit=$(basename "$SNAPSHOT")" >> "$GITHUB_OUTPUT"

      - name: Prepare Unreal Engine distribution
        id: engine
        run: |
          . "$GITHUB_WORKSPACE/Scripts/Linux/BuildServer/runner-env.sh"

          UE_PATH=$("$GITHUB_WORKSPACE/Scripts/Linux/BuildServer/prepare-ue-distribution" \
            "$ARTIFACTORY_UE_REPO/$UE_DISTRIBUTION" --keep 2)

          echo "ue_path=$UE_PATH" >> "$GITHUB_OUTPUT"

      - name: Select content mount mode
        id: mount
        run: |
          . "$GITHUB_WORKSPACE/Scripts/Linux/BuildServer/runner-env.sh"
          MODE="${{ inputs.content_mount_mode }}"

          # The build must be able to write inside the content directory -- CarlaSetup.sh
          # deletes an uncookable asset there -- without those writes reaching the shared
          # 43 GB cache. Podman's :O overlay mount gives the container a throwaway writable
          # layer over a read-only lower directory, which is exactly that. Probe for it
          # rather than assume, because overlay-on-overlay is not supported everywhere.
          if [ "$MODE" = "auto" ]; then
            PROBE="${RUNNER_TEMP}/overlay-probe-${GITHUB_RUN_ID}"
            mkdir -p "$PROBE"
            if podman run --rm --security-opt label=disable --userns=keep-id \
                 -v "$PROBE:/probe:O" "$CONTAINER_IMAGE" \
                 sh -c 'touch /probe/write-test' >/dev/null 2>&1; then
              MODE="overlay"
            else
              MODE="readonly"
              echo "Overlay mounts are unavailable on this host; falling back to read-only."
            fi
            rm -rf "$PROBE"
          fi

          case "$MODE" in
            overlay)   SUFFIX=':O' ;;
            readonly)  SUFFIX=':ro' ;;
            readwrite) SUFFIX='' ;;
            *) echo "ERROR: unknown content mount mode: $MODE" >&2; exit 1 ;;
          esac

          echo "Content mount mode: $MODE"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "suffix=$SUFFIX" >> "$GITHUB_OUTPUT"

      # ────────────────────────────────────────────────────────────────────
      # Build
      # ────────────────────────────────────────────────────────────────────
      - name: Build CARLA distribution
        run: |
          . "$GITHUB_WORKSPACE/Scripts/Linux/BuildServer/runner-env.sh"

          UE_PATH="${{ steps.engine.outputs.ue_path }}"
          CONTENT_SNAPSHOT="${{ steps.content.outputs.snapshot }}"
          CONTENT_SUFFIX="${{ steps.mount.outputs.suffix }}"

          # Old tarballs must not survive into this run. Build/ is now preserved between
          # builds, so a failed cook would otherwise leave yesterday's distribution in
          # Build/Dist for the upload step to find and publish as if it were fresh.
          rm -f "$GITHUB_WORKSPACE"/Build/Dist/*.tar.gz

          # Rootless Podman maps the runner's uid straight through, so everything the
          # build writes into the workspace is owned by this account and needs no
          # privileged cleanup afterwards. Fall back to an explicit uid/gid if this host
          # is ever reconfigured to run Podman as root.
          USER_ARGS=(--userns=keep-id)
          if [ "$(podman info --format '{{.Host.Security.Rootless}}' 2>/dev/null || echo)" != "true" ]; then
            USER_ARGS=(--user "$(id -u):$(id -g)")
          fi

          # SELinux: the caches are labelled container_file_t / container_ro_file_t once
          # during host setup (Docs/build_runner_setup.md), so no per-run relabelling is
          # needed. Never add :z or :Z to these mounts -- relabelling a 43 GB tree on every
          # build is ruinous, and :Z would also privatise it from every other consumer.
          podman run --rm \
            --security-opt label=disable \
            "${USER_ARGS[@]}" \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            -v "$CONTENT_SNAPSHOT:$GITHUB_WORKSPACE/$CONTENT_MOUNT_REL$CONTENT_SUFFIX" \
            -v "$UE_PATH:/opt/unreal-engine" \
            -v "$BUILD_HOME_DIR:/home/builder" \
            -v "$DDC_DIR:/ddc" \
            -w "$GITHUB_WORKSPACE" \
            -e HOME=/home/builder \
            -e "UE-LocalDataCachePath=/ddc" \
            -e "UE-SharedDataCachePath=None" \
            -e CARLA_CONTENT_CACHE_MANAGED=1 \
            -e CARLA_UNREAL_ENGINE_PATH=/opt/unreal-engine \
            "$CONTAINER_IMAGE" \
            bash -lc '
              set -euo pipefail

              echo "=== CarlaSetup.sh ==="
              ./CarlaSetup.sh --skip-prerequisites

              echo "=== Build, cook and package ==="
              ./Scripts/Linux/MakeDistribution.sh --build

              echo "=== Artifacts ==="
              ls -lh Build/Dist/
            '

      - name: Locate distribution
        id: dist
        run: |
          # Exactly one tarball is expected: the directory was emptied before the build.
          mapfile -t FOUND < <(find Build/Dist -maxdepth 1 -type f -name 'Carla-*.tar.gz' 2>/dev/null)

          if [ "${#FOUND[@]}" -eq 0 ]; then
            echo "ERROR: no distribution tarball in Build/Dist/" >&2
            exit 1
          fi
          if [ "${#FOUND[@]}" -gt 1 ]; then
            echo "ERROR: more than one distribution tarball in Build/Dist/:" >&2
            printf '  %s\n' "${FOUND[@]}" >&2
            exit 1
          fi

          BUILT="${FOUND[0]}"
          SHORT_SHA="$(git rev-parse --short=8 HEAD)"

          # Tag the artifact with the source revision. Without it every build of the same
          # CARLA version resolves to one filename and silently overwrites its predecessor
          # in Artifactory, leaving no way to tell which commit produced a given tarball.
          BASE="$(basename "$BUILT" .tar.gz)"
          PUBLISH_NAME="${BASE}-g${SHORT_SHA}.tar.gz"
          PUBLISH_PATH="$(dirname "$BUILT")/$PUBLISH_NAME"

          if [ "$BUILT" != "$PUBLISH_PATH" ]; then
            mv -f "$BUILT" "$PUBLISH_PATH"
          fi

          echo "file=$PUBLISH_PATH" >> "$GITHUB_OUTPUT"
          echo "name=$PUBLISH_NAME" >> "$GITHUB_OUTPUT"
          echo "size=$(du -h "$PUBLISH_PATH" | cut -f1)" >> "$GITHUB_OUTPUT"
          echo "Distribution: $PUBLISH_NAME ($(du -h "$PUBLISH_PATH" | cut -f1))"

      # ────────────────────────────────────────────────────────────────────
      # Publish
      # ────────────────────────────────────────────────────────────────────
      - name: Upload to Artifactory
        if: ${{ !inputs.skip_upload }}
        run: |
          . "$GITHUB_WORKSPACE/Scripts/Linux/BuildServer/runner-env.sh"

          TARGET="$ARTIFACTORY_CARLA_REPO/releases/${{ steps.dist.outputs.name }}"
          "$GITHUB_WORKSPACE/Scripts/Linux/BuildServer/upload-to-artifactory" \
            "${{ steps.dist.outputs.file }}" "$TARGET"

          echo "ARTIFACT_URL=https://iasartifact.sncorp.com:8443/artifactory/$TARGET" >> "$GITHUB_ENV"

      - name: Prune old releases
        if: ${{ !inputs.skip_upload }}
        run: |
          . "$GITHUB_WORKSPACE/Scripts/Linux/BuildServer/runner-env.sh"

          # A distribution is tens of gigabytes; the release folder is capped rather than
          # left to grow against the repository quota.
          "$GITHUB_WORKSPACE/Scripts/Linux/BuildServer/prune-artifactory-releases" \
            "$ARTIFACTORY_CARLA_REPO/releases" --keep "$RELEASES_TO_KEEP"

      # The distribution itself is not uploaded to GitHub artifact storage: it is tens of
      # gigabytes and Artifactory is already its system of record. The checksum is kept so
      # a run can be tied to the exact bytes it published.
      - name: Archive distribution checksum
        if: ${{ always() && steps.dist.outputs.file != '' }}
        run: |
          sha256sum "${{ steps.dist.outputs.file }}" > "${RUNNER_TEMP}/distribution.sha256"
          cat "${RUNNER_TEMP}/distribution.sha256"

      - name: Upload checksum artifact
        if: ${{ always() && steps.dist.outputs.file != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: carla-distribution-checksum
          path: ${{ runner.temp }}/distribution.sha256
          retention-days: 30

      # ────────────────────────────────────────────────────────────────────
      # Cleanup and summary
      # ────────────────────────────────────────────────────────────────────
      - name: Remove per-job registry credentials
        if: always()
        run: rm -f "${RUNNER_TEMP}/podman-auth-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"

      - name: Build summary
        if: always()
        run: |
          {
            echo "## CARLA Distribution Build"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Source commit | \`$(git rev-parse --short=8 HEAD)\` |"
            echo "| UE distribution | \`$UE_DISTRIBUTION\` |"
            echo "| Content ref | \`$CONTENT_REF\` |"
            echo "| Content commit | \`${{ steps.content.outputs.commit }}\` |"
            echo "| Content mount | \`${{ steps.mount.outputs.mode }}\` |"
            if [ -n "${{ steps.dist.outputs.name }}" ]; then
              echo "| Distribution | \`${{ steps.dist.outputs.name }}\` (${{ steps.dist.outputs.size }}) |"
            else
              echo "| Distribution | build failed |"
            fi
            if [ -n "${ARTIFACT_URL:-}" ]; then
              echo
              echo "[Download from Artifactory]($ARTIFACT_URL)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
