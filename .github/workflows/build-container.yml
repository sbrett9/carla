name: Build Container Image

# Builds the carla-base:alma8 container image and pushes it to Artifactory.
# This image is used by the CARLA build workflow and UE distribution builds.
#
# Push location: cat-local-docker-dev/carla-base:alma8
# Pull location: cat-docker-dev/carla-base:alma8
#
# Triggered manually only, on the same reasoning as the distribution build: this job runs a
# Dockerfile from the checked-out branch on the build host and pushes the result to the shared
# registry, so it must not fire automatically until the branch and author rules for that are
# settled. Re-add a `push:` trigger filtered on Util/Docker/Base.alma8.Dockerfile once they are.

on:
  workflow_dispatch:
    inputs:
      no_cache:
        description: 'Build without using cached layers'
        required: false
        type: boolean
        default: false
      prune_before_build:
        description: 'Prune unused Podman images before the build'
        required: false
        type: boolean
        default: false

# The image and the distribution build share the runner's Podman storage, so they must
# not run at the same time.
concurrency:
  group: carla-container-image
  cancel-in-progress: false

env:
  # Artifactory Docker registries
  ARTIFACTORY_PUSH_REGISTRY: 'iasartifact.sncorp.com:8443/cat-local-docker-dev'
  ARTIFACTORY_PULL_REGISTRY: 'iasartifact.sncorp.com:8443/cat-docker-dev'

  # Image name and tag
  IMAGE_NAME: 'carla-base'
  IMAGE_TAG: 'alma8'

jobs:
  build:
    name: Build and Push Container Image
    runs-on: self-hosted
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Artifactory authentication
        run: |
          # runner-env.sh resolves the runner account's real home from the passwd database
          # and restores HOME and XDG_RUNTIME_DIR, which GitHub Actions overrides per step
          # and rootless Podman needs. Container storage is redirected to a graphroot on
          # the RAID array, where there is room for the image layers.
          . "$GITHUB_WORKSPACE/Scripts/Linux/BuildServer/runner-env.sh"
          export GRAPHROOT_BASE="$HOME/containers/storage"
          export GRAPHROOT_LINK="$HOME/.local/share/containers/storage"
          mkdir -p "$HOME/.config/containers" "$HOME/.local/share/containers" "$HOME/containers" "$GRAPHROOT_BASE"
          if [ -d "$GRAPHROOT_LINK" ] && [ ! -L "$GRAPHROOT_LINK" ]; then
            mv "$GRAPHROOT_LINK" "$GRAPHROOT_LINK.pre-carla-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          fi
          ln -sfn "$GRAPHROOT_BASE" "$GRAPHROOT_LINK"

          if [ -f "$HOME/.docker/config.json" ]; then
            AUTH_SOURCE="$HOME/.docker/config.json"
          elif [ -f "$HOME/.config/containers/auth.json" ]; then
            AUTH_SOURCE="$HOME/.config/containers/auth.json"
          else
            echo "Missing OCI registry auth for $HOME" >&2
            exit 1
          fi

          AUTH_COPY="${RUNNER_TEMP:-$PWD}/podman-auth-${GITHUB_RUN_ID}-${GITHUB_JOB}.json"
          cp "$AUTH_SOURCE" "$AUTH_COPY"
          chmod 600 "$AUTH_COPY"
          echo "REGISTRY_AUTH_FILE=$AUTH_COPY" >> "$GITHUB_ENV"

      - name: Prune unused Podman images
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.prune_before_build == 'true' }}
        run: |
          . "$GITHUB_WORKSPACE/Scripts/Linux/BuildServer/runner-env.sh"

          podman image prune -a -f
      
      - name: Build container image
        env:
          NO_CACHE: ${{ github.event.inputs.no_cache == 'true' && 'true' || 'false' }}
        run: |
          # Build with rootless Podman
          . "$GITHUB_WORKSPACE/Scripts/Linux/BuildServer/runner-env.sh"

          BUILD_ARGS=()
          if [ "$NO_CACHE" = "true" ]; then
            BUILD_ARGS+=(--no-cache --pull=always)
          fi
          
          podman build \
            "${BUILD_ARGS[@]}" \
            -t "${ARTIFACTORY_PUSH_REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}" \
            -f Util/Docker/Base.alma8.Dockerfile \
            Util/Docker/
          
          echo "Image built: ${ARTIFACTORY_PUSH_REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"
      
      - name: Push to Artifactory
        run: |
          # Push with rootless Podman
          . "$GITHUB_WORKSPACE/Scripts/Linux/BuildServer/runner-env.sh"
          
          podman push "${ARTIFACTORY_PUSH_REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"
          
          echo "Image pushed to: ${ARTIFACTORY_PUSH_REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"
          echo "Pull from: ${ARTIFACTORY_PULL_REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"

      - name: Podman storage usage
        run: |
          . "$GITHUB_WORKSPACE/Scripts/Linux/BuildServer/runner-env.sh"

          echo "### Podman storage usage" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          podman system df | tee -a $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      
      - name: Build summary
        run: |
          echo "## Container Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${IMAGE_NAME}:${IMAGE_TAG}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Push Registry:** \`${ARTIFACTORY_PUSH_REGISTRY}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Pull Registry:** \`${ARTIFACTORY_PULL_REGISTRY}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Usage" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "podman pull ${ARTIFACTORY_PULL_REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
