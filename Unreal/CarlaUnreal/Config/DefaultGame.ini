# These two do NOT describe what is built. UAT reads pak and iostore settings from its command line,
# and the packaging invocation passes neither, so the shipped build is LOOSE COOKED FILES and these
# values are inert. That is deliberate and worth keeping: a simulation server benefits from loose
# files, and a level exported after the fact is added by copying a directory into the package rather
# than by rebuilding a pak. Adding -pak / -iostore to the cook to "fix" this mismatch would silently
# invalidate every already-exported level, so change the packaging invocation and these values
# together, or not at all.
