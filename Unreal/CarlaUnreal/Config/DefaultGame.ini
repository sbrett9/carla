+DirectoriesToAlwaysCook=(Path="/Game/Carla/Blueprints/Walkers")
# CARLA spawns prop / pedestrian assets BY NAME at runtime (via the blueprint library), so they are
# not hard-referenced by any cooked map and would otherwise be skipped -> the server then fails at
# spawn time with "package to load does not exist on disk" (e.g. SM_PlantPot05, SM_Garbage06) and
# crashes. Always-cook the spawnable subtrees explicitly. NOTE: cook these targeted directories, NOT
# the whole /Game/Carla/Static tree -- that drags in broken legacy assets (e.g. Static/Car/2wheeled
# anims with unresolvable skeletons) that hard-crash the cooker (AnimSequence !Hash.IsZero).
+DirectoriesToAlwaysCook=(Path="/Game/Carla/Static/Static")
+DirectoriesToAlwaysCook=(Path="/Game/Carla/Static/Dynamic")
+DirectoriesToAlwaysCook=(Path="/Game/Carla/Static/Pedestrian")
# Cesium spawns its on-screen credit system (and other helper actors) procedurally at runtime. The
# blueprints are referenced only by TSoftObjectPtr defaults in native engine-subsystem CDOs (e.g.
# CesiumCreditSystemBP in UCesiumCreditSystemBPLoader), which are NOT cook roots, so nothing drags
# them into the cook. In the editor they load fine; in a packaged server CesiumCreditSystemBP fails
# to load -> SpawnActor returns null -> the tileset's CreditSystem::createCredit dereferences the
# null credit system and crashes. Always-cook the (small) Cesium plugin content so the credit-system
# BP, its ScreenCredits widget, and the logo textures/fonts it pulls in all exist at runtime.
+DirectoriesToAlwaysCook=(Path="/CesiumForUnreal")
# Worlds imported from a world package live here, one level plus its settings assets per world. A
# directory rather than a MapsToCook entry per world, so a world imported after this file was last
# edited is still cooked. The baked road meshes under /Game/Carla/Static/Road are hard-referenced by
# the level's actors and so are cooked as its dependencies, without needing the whole Static tree.
+DirectoriesToAlwaysCook=(Path="/Game/Carla/Maps/Generated")
# EXPERIMENT SCAFFOLDING (Findings/24 step 7): a world exported as its own plugin mounts at
# /<WorldName>/, which nothing cooks by default -- an explicitly-loaded plugin is not referenced by
# anything, so the cooker never reaches it. Naming one world here proves the cooked, plugin-hosted,
# long-path map loads; it is NOT the shipping answer, since a world added after the build is exactly
# the case this cannot express. That wants DLC cooking, which needs -CreateReleaseVersion on the base
# build and is deliberately deferred.
+DirectoriesToAlwaysCook=(Path="/Arapahoe_I25")
# A map is cooked only if it is named in MapsToCook or referenced by something that is:
# DirectoriesToAlwaysCook brings in a directory's assets but NOT its levels, which is why the
# settings and the field cooked while the .umap did not. Also scaffolding -- a static list cannot
# name a world that does not exist yet, which is exactly the case a DLC cook has to serve.
+MapsToCook=(FilePath="/Arapahoe_I25/Maps/Arapahoe_I25")
+DirectoriesToAlwaysStageAsUFS=(Path="Carla/Maps/OpenDrive")
# The road network of an imported world is a loose .xodr read from disk at runtime, not an asset any
# cooked package refers to, so it is staged explicitly the way the base map's own network is. Without
# this a generated level ships its geometry but loads with no road graph: no waypoints, no traffic
# manager, no telemetry.
+DirectoriesToAlwaysStageAsUFS=(Path="Carla/Maps/Generated/OpenDrive")
+DirectoriesToAlwaysStageAsUFS=(Path="Carla/Maps/Town15/OpenDrive")
+DirectoriesToAlwaysStageAsUFS=(Path="Carla/Maps/Town15/Nav")
+DirectoriesToAlwaysStageAsUFS=(Path="Carla/Maps/Town15/TM")
+DirectoriesToAlwaysStageAsUFS=(Path="Carla/Maps/Nav")
+DirectoriesToAlwaysStageAsUFS=(Path="Carla/Maps/TM")
+DirectoriesToAlwaysStageAsUFS=(Path="Carla/Config")
