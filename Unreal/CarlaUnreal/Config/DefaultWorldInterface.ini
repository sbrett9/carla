; What a separately delivered world can rely on this build providing.
;
; This is a PROMISE, not a fingerprint. It is edited by hand, and changing it is meant to be a
; visible one-line commit rather than something derived from a build number or a commit hash --
; a hash only ever answers "identical?", which is the wrong question. Unreal draws the same
; distinction: Engine/Build/Build.version carries a Changelist for identity and a separate
; CompatibleChangelist for what it can load.
;
; A world records the version it was packaged against. An install is allowed when
;
;     base.Major == world.Major   AND   base.Minor >= world.Minor
;
; so a world built against 1.2 installs into 1.2, 1.7 or 1.99, and is refused by 2.0 or 1.1.
;
; Bump MAJOR when an already-delivered world would stop loading:
;   - content a world references is renamed or deleted (the road materials especially)
;   - a class a world's assets store changes shape (UGeoreferencedWorldSettings, URoadNetworkAsset,
;     UBareEarthOffsetField)
;   - the engine moves to a version that changes the cooked package format
; Reset Minor to 0 at the same time.
;
; Bump MINOR when content is ADDED that a world might reference. Worlds built before the addition
; keep working; worlds built after it need a base that has it.
;
; Change NEITHER for anything a delivered world cannot observe: gameplay code, RPC handlers, tools,
; how a material looks, new maps in the base package.
;
; Staged into the package as CarlaUnreal/Config/DefaultWorldInterface.ini, reported over the
; `get_world_interface_version` RPC, printed by RunCarlaServer.ps1 -Version, and logged at startup.

[WorldInterface]
Major=1
Minor=0
