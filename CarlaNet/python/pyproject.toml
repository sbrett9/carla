[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "carlanet"
# The release version is stamped by setup.py from the top-level CMakeLists.txt.
dynamic = ["version"]
description = "Managed .NET client for CARLA simulator"
requires-python = ">=3.8"
license = "MIT"
authors = [{ name = "CarlaNet contributors" }]
dependencies = [
    "pythonnet>=3.0.5",
    "clr-loader>=0.2",
]

[tool.setuptools.packages.find]
where = ["."]
# Only ship the real package. Without these filters setuptools also discovers stale copies left
# under build/ (e.g. build/lib/carlanet), then re-copies build/ into itself on the next run, nesting
# build/lib/build/lib/.../carlanet deeper every build and polluting the wheel.
include = ["carlanet*"]
exclude = ["build*", "dist*"]

[tool.setuptools.package-data]
carlanet = [
    "dlls/*.dll",
    "dlls/*.pdb",
    "dlls/*.deps.json",
    "dlls/*.runtimeconfig.json",
]
